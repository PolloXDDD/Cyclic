name = "MillenniumSuite"
version = "0.2.0"
defaultTargets = ["MillenniumSuite"]

[[require]]
name = "mathlib"
scope = "leanprover-community"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "v4.34.0-rc2"

[[lean_lib]]
name = "MillenniumSuite"
leanOptions = { autoImplicit = false, warningAsError = true }
globs = ["MillenniumSuite", "MillenniumSuite.+"]
